{% macro events_list(events=[]) %}
  <div>
    {% for event in events %}
    <div class="card event">
      <h3>{{ event.title }}</h3>
      <p>📌 {{ event.location }}</p>
      <br />
      {% if session.user_id == event.user_id %}
      <a href="/event/{{ event.id }}" class="button">Manage event</a>
      {% else %}
      <a href="/event/{{ event.id }}" class="button">Read more and RSVP</a>
      {% endif %}
    </div>
    {% endfor %}
  </div>
{% endmacro %}
