{% extends "layout.html" %}

{% block content %}
<form action="/delete_event/{{ event.id }}" method="post" class="card">
  <h2>deleting event {{ event.title }}</h2>
  <p>
    Are you sure you want to delete this event?
  </p>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" name="delete" value="delete" />
  <input type="submit" name="keep" value="keep event" />
  </form>
{% endblock %}
