{% extends "layout.html" %}
{% import 'list.html' as list %}

{% block content %}
{% if session.username %}
<h2>
  Welcome to snackRSVP {{ session.username }}!
</h2>
{% else %}
<div class="card">
  <h2>Welcome to snackRSVP!</h2>
  <p>
    <a href="/login" class="button">log in</a>
    or
    <a href="/register" class="button">register</a>
    to create events and RSVP!
  </p>
</div>
{% endif %}

{{ list.events_list(events) }}

{% endblock %}
