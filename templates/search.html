{% extends "layout.html" %}
{% import 'list.html' as list %}

{% block content %}

<form action="/search" method="get" class="card">
  <h2>Events search</h2>
  <p>
    Search by title: <br />
    {% if query %}
    <input type="text" name="query" value="{{ query }}" />
    {% else %}
    <input type="text" name="query" />
    {% endif %}
  </p>
  <br />
  <input type="submit" value="search" class="button" />
</form>

{% if events == [] %}
<div class="card">
  <p>
    No results for search {{ query }}
  </p>
</div>
{% endif %}

{{ list.events_list(events) }}

{% endblock %}
