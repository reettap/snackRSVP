<!DOCTYPE html>
<html>

<head>
  <title>snackRSVP</title>
  <link rel="stylesheet" href="/static/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=person"
    rel="stylesheet" />
</head>

<body>
  <header class="header">
    <div class="header-content">
      <h1><a href="/">snackRSVP</a></h1>
      <div class="login">
      {% if session.username %}
      <a href="/user/{{ session.user_id }}" class="button">
        <span class="material-symbols-outlined">person</span>
        {{ session.username }}
      </a>
      <a href="/logout" class="button">log out</a>
      {% else %}
      <p>
        <a href="/login" class="button">log in</a> or
        <a href="/register" class="button">register</a>
      </p>

      {% endif %}
      </div>
    </div>
    <nav class="nav-buttons">
      <a class="button" href="/">Events</a>
      <a class="button" href="/search">Search</a>
      {% if session.user_id %}
      <a class="button" href="/">My Events</a>
      <a class="button" href="/new_event">New Event</a>
      {% endif %}

    </nav>
  </header>

  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <footer>
    Events should have snacks
  </footer>
</body>

</html>
